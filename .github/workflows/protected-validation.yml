name: HolyCode - Protected Validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      release_title:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      version:
        description: Planned release tag, for example v1.1.3
        required: true
        type: string
      release_title:
        description: Planned GitHub release title
        required: true
        type: string

concurrency:
  group: protected-validation-${{ github.sha }}
  cancel-in-progress: true

env:
  CANDIDATE_IMAGE: ghcr.io/coderluii/holycode
  PREVIOUS_IMAGE: coderluii/holycode:1.1.2@sha256:65740c4d8aa416217391f53de4be984ea9f8dfd5f10553dead94db402645b537
  PREVIOUS_VERSION: v1.1.2
  RELEASE_VERSION: v1.1.3

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release metadata and commit binding
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_RELEASE_TITLE: ${{ inputs.release_title }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ]
          [ "$actual_sha" = "$GITHUB_SHA" ]
          [ "$REQUESTED_VERSION" = "$RELEASE_VERSION" ]
          [ "$REQUESTED_RELEASE_TITLE" = "$RELEASE_VERSION" ]

          commit_title="$(git log -1 --format=%s HEAD)"
          python scripts/validate_version.py \
            --version "$RELEASE_VERSION" \
            --previous-version "$PREVIOUS_VERSION" \
            --tag-name "$RELEASE_VERSION" \
            --commit-title "$commit_title" \
            --release-title "$REQUESTED_RELEASE_TITLE"

          git merge-base --is-ancestor "$PREVIOUS_VERSION" HEAD
          commit_count="$(git rev-list --count "$PREVIOUS_VERSION..HEAD")"
          if [ "$commit_count" -ne 1 ]; then
            echo "Release range $PREVIOUS_VERSION..$RELEASE_VERSION contains $commit_count commits; expected exactly 1" >&2
            exit 1
          fi

          echo "Validated exact candidate $actual_sha for $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push attested candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CANDIDATE_IMAGE }}:validation-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Record immutable candidate digest
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > candidate-digest.txt
          echo "Candidate digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holycode-${{ inputs.version }}-candidate
          if-no-files-found: error
          path: candidate-digest.txt

  protected-validation:
    needs: build-candidate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
            scout_arch: amd64
            scout_sha256: 0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            scout_arch: arm64
            scout_sha256: 88eecb7273f19bd18300d70e6f85b2e7d784e9e4f3cbb4a2b400db6b8355a52a
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact candidate digest
        env:
          CANDIDATE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform "${{ matrix.platform }}" "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
          docker tag "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" "holycode-protected-validation:${{ matrix.suffix }}"

      - name: Smoke test tools and Chromium sandbox
        run: bash scripts/smoke_image.sh "holycode-protected-validation:${{ matrix.suffix }}"

      - name: Validate upgrade, persistence, and rollback
        env:
          CURRENT_IMAGE: holycode-protected-validation:${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test_upgrade_rollback.sh "$CURRENT_IMAGE" "$PREVIOUS_IMAGE" "$PLATFORM"

      - name: Generate SPDX SBOM for Docker Scout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: spdx-json
          output: holycode-${{ matrix.suffix }}.spdx.json

      - name: Install Docker Scout CLI
        env:
          SCOUT_SHA256: ${{ matrix.scout_sha256 }}
          SCOUT_VERSION: 1.23.1
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/docker-scout_${SCOUT_VERSION}_linux_${{ matrix.scout_arch }}.tar.gz"
          bin_dir="$RUNNER_TEMP/docker-scout-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/docker-scout_${SCOUT_VERSION}_linux_${{ matrix.scout_arch }}.tar.gz"
          printf '%s  %s\n' "$SCOUT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" docker-scout
          chmod 0755 "$bin_dir/docker-scout"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/docker-scout" version

      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout vulnerability reports
        env:
          SCOUT_FIXABLE_REPORT: holycode-${{ matrix.suffix }}.scout-fixable.sarif
          SCOUT_REPORT: holycode-${{ matrix.suffix }}.scout.sarif
          SCOUT_SBOM: holycode-${{ matrix.suffix }}.spdx.json
        run: |
          set -euo pipefail

          docker-scout cves "sbom://$SCOUT_SBOM" \
            --only-severity critical,high \
            --format sarif \
            --output "$SCOUT_REPORT"
          docker-scout cves "sbom://$SCOUT_SBOM" \
            --only-severity critical,high \
            --only-fixed \
            --format sarif \
            --output "$SCOUT_FIXABLE_REPORT"

      - name: Docker Scout fixable critical and high gate
        env:
          SCOUT_FIXABLE_REPORT: holycode-${{ matrix.suffix }}.scout-fixable.sarif
        run: |
          set -euo pipefail

          jq -e '.runs | type == "array" and length > 0' "$SCOUT_FIXABLE_REPORT" >/dev/null
          findings="$(jq '[.runs[].results[]?] | length' "$SCOUT_FIXABLE_REPORT")"
          if [ "$findings" -ne 0 ]; then
            jq -r '.runs[].results[]? | [.ruleId, .message.text] | @tsv' "$SCOUT_FIXABLE_REPORT" >&2
            echo "Docker Scout found $findings fixable critical/high findings" >&2
            exit 1
          fi

      - name: Summarize Docker Scout vulnerability report
        env:
          SCOUT_REPORT: holycode-${{ matrix.suffix }}.scout.sarif
        run: |
          set -euo pipefail

          jq -e '.runs | type == "array" and length > 0' "$SCOUT_REPORT" >/dev/null
          findings="$(jq '[.runs[].results[]?] | length' "$SCOUT_REPORT")"
          rules="$(jq '[.runs[].tool.driver.rules[]?] | length' "$SCOUT_REPORT")"
          {
            echo "### Docker Scout (${{ matrix.platform }})"
            echo
            echo "- SARIF results: $findings"
            echo "- Vulnerability rules: $rules"
            echo "- Input: SPDX SBOM generated from the exact candidate digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 0
          output: holycode-${{ matrix.suffix }}.trivy.txt

      - name: Show Trivy vulnerability report
        run: cat holycode-${{ matrix.suffix }}.trivy.txt

      - name: Trivy fixable critical and high gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Collect architecture evidence
        env:
          CANDIDATE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail

          docker run --rm --entrypoint cat \
            "holycode-protected-validation:${{ matrix.suffix }}" \
            /usr/local/share/holycode/dpkg-inventory.txt \
            > "holycode-${{ matrix.suffix }}.dpkg-inventory.txt"
          docker image inspect \
            --format '{{.Id}}' \
            "holycode-protected-validation:${{ matrix.suffix }}" \
            > "holycode-${{ matrix.suffix }}.image-id.txt"
          printf '%s\n' "$CANDIDATE_DIGEST" > "holycode-${{ matrix.suffix }}.candidate-digest.txt"

      - name: Upload architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holycode-${{ inputs.version }}-${{ matrix.suffix }}-evidence
          if-no-files-found: error
          path: |
            holycode-${{ matrix.suffix }}.candidate-digest.txt
            holycode-${{ matrix.suffix }}.dpkg-inventory.txt
            holycode-${{ matrix.suffix }}.image-id.txt
            holycode-${{ matrix.suffix }}.scout-fixable.sarif
            holycode-${{ matrix.suffix }}.scout.sarif
            holycode-${{ matrix.suffix }}.spdx.json
            holycode-${{ matrix.suffix }}.trivy.txt
