name: HolyCode - Source checks

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_execution:
        description: Run optional source checks without building release images
        type: boolean
        required: true
        default: false

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Optional development check. The release workflow runs these checks itself;
# do not run this workflow as a prerequisite for a release.

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Require main for manual validation
        if: github.event_name == 'workflow_dispatch'
        env:
          HOSTED_EXECUTION_APPROVED: ${{ inputs.confirm_hosted_execution }}
        run: |
          test "$HOSTED_EXECUTION_APPROVED" = true
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for Renovate validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            .github/workflows/pr-validation.yml
            renovate.json
            scripts/validate_renovate_extraction.sh

      - name: Python version policy tests
        run: python -m unittest discover -s tests

      - name: Static action pin checks
        run: python scripts/validate_workflow_pins.py

      - name: Chromium seccomp profile
        run: python scripts/validate_chromium_seccomp.py

      - name: JSON syntax
        run: |
          python -m json.tool renovate.json >/tmp/renovate.json

      - name: Workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.load_file(path) }'

      - name: Compose config
        run: |
          set -eu
          docker compose -f docker-compose.yaml config --no-interpolate >/tmp/docker-compose.yaml
          docker compose -f docker-compose.full.yaml config --no-interpolate >/tmp/docker-compose.full.yaml
          if docker compose -f docker-compose.full.yaml config --services | grep -Fx cliproxyapi; then
            echo "bundled CLIProxyAPI service must remain removed until its fixed image is verified" >&2
            exit 1
          fi

      - name: Renovate configuration
        run: bash scripts/validate_renovate_extraction.sh 44.129.0
