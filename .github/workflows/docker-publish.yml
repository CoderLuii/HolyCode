name: HolyCode - Build and Push to Docker Hub + GHCR
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: coderluii/holycode
  GHCR_IMAGE: ghcr.io/coderluii/holycode

# Required secrets:
#   DOCKERHUB_USERNAME - Docker Hub username with access to coderluii/holycode.
#   DOCKERHUB_TOKEN - Docker Hub access token with push and description-update access.

jobs:
  protected-validation:
    uses: ./.github/workflows/protected-validation.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      previous_version: v1.1.0
      previous_image: coderluii/holycode:1.1.0@sha256:a6df9d85fd40c1e24300e3dccd9a41c30c187f8187c1d533b8096a2a219f05a7
      release_title: ${{ github.ref_name }}
      allow_legacy_bridge: false

  build-and-push:
    needs: protected-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release tag and commit title
        run: |
          set -euo pipefail

          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$current" | head -n 1 || true)"
          commit_title="$(git log -1 --format=%s "$GITHUB_SHA")"
          legacy_args=()

          if [ "$previous" = "v1.0.13" ] && [ "$current" = "v1.1.0" ]; then
            legacy_args=(--allow-legacy-v1-0-13-to-v1-1-0)
          fi

          python scripts/validate_version.py \
            --version "$current" \
            --previous-version "$previous" \
            --tag-name "$current" \
            --commit-title "$commit_title" \
            "${legacy_args[@]}"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  update-dockerhub-description:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: coderluii/holycode
          short-description: "OpenCode in Docker, AI coding workstation with persistent state and curated tools"
          readme-filepath: ./docs/dockerhub-description.md
