name: HolyCode - Manual hosted release fallback
run-name: ${{ inputs.release_version }} hosted fallback

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_execution:
        description: Separately authorized hosted execution; normal releases run locally
        type: boolean
        required: true
        default: false
      release_version:
        description: Exact version with a source-bound draft release
        type: string
        required: true
        default: v1.3.0

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: coderluii/holycode
  GHCR_IMAGE: ghcr.io/coderluii/holycode
  CANDIDATE_IMAGE: ghcr.io/coderluii/holycode
  PREVIOUS_IMAGE: coderluii/holycode:1.2.9@sha256:3d0bdce2a62f4eb6a5b03ec644b608d2c370da143474c6c6a81474ef1a16c439
  PREVIOUS_VERSION: v1.2.9
  RELEASE_VERSION: v1.3.0

# Required secrets:
#   DOCKERHUB_USERNAME - Docker Hub username with access to coderluii/holycode.
#   DOCKERHUB_TOKEN - Docker Hub access token with push and description-update access.

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Draft release listings require push access, even for this metadata read.
      contents: write

    steps:
      - name: Require explicit hosted fallback authorization
        env:
          HOSTED_EXECUTION_APPROVED: ${{ inputs.confirm_hosted_execution }}
        run: |
          test "$HOSTED_EXECUTION_APPROVED" = true
          test "$GITHUB_REF" = refs/heads/main

      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release metadata and commit binding
        env:
          REQUESTED_REF: ${{ github.sha }}
          REQUESTED_RELEASE_TITLE: ${{ inputs.release_version }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ]
          [ "$actual_sha" = "$GITHUB_SHA" ]
          [ "$actual_sha" = "$(git rev-parse origin/main)" ]
          [ "$REQUESTED_VERSION" = "$RELEASE_VERSION" ]
          [ "$REQUESTED_RELEASE_TITLE" = "$RELEASE_VERSION" ]

          commit_title="$(git log -1 --format=%s HEAD)"
          python scripts/validate_version.py \
            --version "$RELEASE_VERSION" \
            --previous-version "$PREVIOUS_VERSION" \
            --tag-name "$RELEASE_VERSION" \
            --commit-title "$commit_title" \
            --release-title "$REQUESTED_RELEASE_TITLE"

          git merge-base --is-ancestor "$PREVIOUS_VERSION" HEAD
          commit_count="$(git rev-list --count "$PREVIOUS_VERSION..HEAD")"
          if [ "$commit_count" -ne 1 ]; then
            echo "Release range $PREVIOUS_VERSION..$RELEASE_VERSION contains $commit_count commits; expected exactly 1" >&2
            exit 1
          fi

          echo "Validated exact candidate $actual_sha for $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Require unpublished image aliases and a matching draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_target.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --sha "$GITHUB_SHA" --require-draft \
            --previous-digest "${PREVIOUS_IMAGE##*@sha256:}"

      - name: Verify Docker Hub credentials before native builds
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node for Renovate validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Static release validation
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          python scripts/validate_workflow_pins.py
          python scripts/validate_chromium_seccomp.py
          python -m json.tool renovate.json >/tmp/renovate.json
          python -m json.tool config/npm-global-script-policy.json >/tmp/npm-global-script-policy.json
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.load_file(path) }'
          docker compose -f docker-compose.yaml config --no-interpolate >/tmp/docker-compose.yaml
          docker compose -f docker-compose.full.yaml config --no-interpolate >/tmp/docker-compose.full.yaml
          bash scripts/validate_renovate_extraction.sh 44.129.0

  build-candidate:
    needs: validate-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Require native build architecture
        run: |
          set -euo pipefail
          case "${{ matrix.suffix }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match native build" >&2; exit 1 ;;
          esac

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push attested candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.CANDIDATE_IMAGE }}:validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_version }}
          cache-from: |
            type=gha,scope=release-${{ matrix.suffix }}
            type=gha
          cache-to: type=gha,scope=release-${{ matrix.suffix }},mode=max
          sbom: true
          provenance: mode=max

      - name: Record immutable native candidate digest
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "candidate-${{ matrix.suffix }}.txt"
          echo "Native ${{ matrix.platform }} candidate digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native candidate digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holycode-${{ inputs.release_version }}-${{ matrix.suffix }}-candidate
          if-no-files-found: error
          path: candidate-${{ matrix.suffix }}.txt

  compose-candidate:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.compose.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify both native candidate digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "holycode-$RELEASE_VERSION-$arch-candidate" \
              --dir "candidate-inputs/$arch"
            digest="$(tr -d '\r\n' < "candidate-inputs/$arch/candidate-$arch.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$CANDIDATE_IMAGE@$digest" \
              --format '{{json .Manifest}}' > "candidate-$arch.index.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          expected = []
          for arch in ("amd64", "arm64"):
              index = json.loads(Path(f"candidate-{arch}.index.json").read_text())
              digest = Path(f"candidate-inputs/{arch}/candidate-{arch}.txt").read_text().strip()
              assert index["digest"] == digest and index["schemaVersion"] == 2
              assert index["mediaType"] == "application/vnd.oci.image.index.v1+json"
              native = [m for m in index["manifests"] if m.get("platform", {}).get("os") == "linux"
                        and m["platform"]["architecture"] == arch]
              attestations = [m for m in index["manifests"] if m.get("annotations", {}).get(
                  "vnd.docker.reference.type") == "attestation-manifest"]
              assert len(native) == 1 and attestations
              assert len(index["manifests"]) == 1 + len(attestations)
              assert all(m["annotations"]["vnd.docker.reference.digest"] == native[0]["digest"]
                         for m in attestations)
              expected.extend(index["manifests"])
          assert len({m["digest"] for m in expected}) == len(expected)
          Path("expected-manifests.json").write_text(json.dumps(sorted(expected, key=lambda m: m["digest"])))
          PY

      - name: Compose exact attested native candidates
        id: compose
        run: |
          set -euo pipefail
          amd64="$(tr -d '\r\n' < candidate-inputs/amd64/candidate-amd64.txt)"
          arm64="$(tr -d '\r\n' < candidate-inputs/arm64/candidate-arm64.txt)"
          tag="$CANDIDATE_IMAGE:validation-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --metadata-file candidate-metadata.json \
            --tag "$tag" "$CANDIDATE_IMAGE@$amd64" "$CANDIDATE_IMAGE@$arm64"
          digest="$(jq -er '."containerimage.descriptor".digest' candidate-metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$CANDIDATE_IMAGE@$digest" \
            --format '{{json .Manifest}}' > candidate-index.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("candidate-metadata.json").read_text())["containerimage.descriptor"]
          combined = json.loads(Path("candidate-index.json").read_text())
          expected = json.loads(Path("expected-manifests.json").read_text())
          assert combined["digest"] == metadata["digest"] and combined["schemaVersion"] == 2
          assert combined["mediaType"] == metadata["mediaType"] == "application/vnd.oci.image.index.v1+json"
          assert sorted(combined["manifests"], key=lambda m: m["digest"]) == expected
          PY
          printf '%s\n' "$digest" > candidate-digest.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Combined native candidate digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holycode-${{ inputs.release_version }}-candidate
          if-no-files-found: error
          path: candidate-digest.txt

  protected-validation:
    needs: compose-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
            scout_arch: amd64
            scout_sha256: 9157cdc9372b478a8cd51dd53f5e9c74a7e34056ea291c65520bf76016fa72f4
            trivy_arch: 64bit
            trivy_sha256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            scout_arch: arm64
            scout_sha256: bcb16a65b7266413fea05e9dc352159485609e62a6cbd049207118b0aa7d8611
            trivy_arch: ARM64
            trivy_sha256: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact candidate digest
        env:
          CANDIDATE_DIGEST: ${{ needs.compose-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform "${{ matrix.platform }}" "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
          docker tag "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" "holycode-protected-validation:${{ matrix.suffix }}"

      - name: Smoke test tools and Chromium sandbox
        run: bash scripts/smoke_image.sh "holycode-protected-validation:${{ matrix.suffix }}"

      - name: Validate offline plugin modes
        run: bash scripts/test_plugin_modes.sh "holycode-protected-validation:${{ matrix.suffix }}"

      - name: Validate Chromium security floor and refreshed availability
        run: |
          set -euo pipefail
          image="holycode-protected-validation:${{ matrix.suffix }}"
          actual_arch="$(docker run --rm --entrypoint dpkg "$image" --print-architecture)"
          [ "linux/$actual_arch" = "${{ matrix.platform }}" ]

          for package in chromium chromium-common chromium-sandbox; do
            installed="$(docker run --rm --entrypoint dpkg-query "$image" -W -f='${Version}' "$package")"
            available="$(docker run --rm --entrypoint sh "$image" -lc \
              "apt-get update --error-on=any >/dev/null && apt-cache policy '$package' | awk '/Candidate:/ {print \$2}'")"
            [ -n "$installed" ]
            [ -n "$available" ]
            bash scripts/validate_chromium_version.sh \
              "$installed" "${{ matrix.platform }}" "$RELEASE_VERSION" "$(date -u +%F)"
            dpkg --compare-versions "$installed" ge "$available"
            printf '%s installed=%s available=%s platform=%s\n' \
              "$package" "$installed" "$available" "${{ matrix.platform }}"
          done

      - name: Validate upgrade, persistence, and rollback
        env:
          CURRENT_IMAGE: holycode-protected-validation:${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          bash scripts/test_upgrade_rollback.sh "$CURRENT_IMAGE" "$PREVIOUS_IMAGE" "$PLATFORM" |
            tee "holycode-${{ matrix.suffix }}.upgrade-rollback.txt"

      - name: Install Trivy CLI
        env:
          TRIVY_SHA256: ${{ matrix.trivy_sha256 }}
          TRIVY_VERSION: 0.76.1
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-${{ matrix.trivy_arch }}.tar.gz"
          bin_dir="$RUNNER_TEMP/trivy-bin"
          curl --disable --proto '=https' --tlsv1.2 --retry 8 --retry-all-errors \
            --retry-max-time 300 --remove-on-error --connect-timeout 15 --max-time 300 \
            --fail --silent --show-error --location --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${{ matrix.trivy_arch }}.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/trivy" --version

      - name: Generate SPDX SBOM for Docker Scout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: spdx-json
          output: holycode-${{ matrix.suffix }}.spdx.json

      - name: Install Docker Scout CLI
        env:
          SCOUT_SHA256: ${{ matrix.scout_sha256 }}
          SCOUT_VERSION: 1.29.0
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/docker-scout_${SCOUT_VERSION}_linux_${{ matrix.scout_arch }}.tar.gz"
          bin_dir="$RUNNER_TEMP/docker-scout-bin"
          curl --disable --proto '=https' --tlsv1.2 --retry 8 --retry-all-errors \
            --retry-max-time 300 --remove-on-error --connect-timeout 15 --max-time 300 \
            --fail --silent --show-error --location --output "$archive" \
            "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/docker-scout_${SCOUT_VERSION}_linux_${{ matrix.scout_arch }}.tar.gz"
          printf '%s  %s\n' "$SCOUT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" docker-scout
          chmod 0755 "$bin_dir/docker-scout"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/docker-scout" version

      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout vulnerability reports
        env:
          SCOUT_FIXABLE_REPORT: holycode-${{ matrix.suffix }}.scout-fixable.sarif
          SCOUT_REPORT: holycode-${{ matrix.suffix }}.scout.sarif
          SCOUT_SBOM: holycode-${{ matrix.suffix }}.spdx.json
        run: |
          set -euo pipefail

          docker-scout cves "sbom://$SCOUT_SBOM" \
            --only-severity critical,high \
            --format sarif \
            --output "$SCOUT_REPORT"
          docker-scout cves "sbom://$SCOUT_SBOM" \
            --only-severity critical,high \
            --only-fixed \
            --format sarif \
            --output "$SCOUT_FIXABLE_REPORT"

      - name: Docker Scout fixable critical and high gate
        id: scout_gate
        continue-on-error: true
        env:
          SCOUT_REPORT: holycode-${{ matrix.suffix }}.scout.sarif
        run: |
          set -euo pipefail

          jq -e '.runs | type == "array" and length > 0' "$SCOUT_REPORT" >/dev/null
          python scripts/validate_scanner_findings.py \
            --scanner scout \
            --report "$SCOUT_REPORT" \
            --release "$RELEASE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --accept-upstream-vulnerabilities \
            --accepted-findings "holycode-${{ matrix.suffix }}.scout-accepted.json" \
            --as-of "$(date -u +%F)"

      - name: Summarize Docker Scout vulnerability report
        env:
          SCOUT_REPORT: holycode-${{ matrix.suffix }}.scout.sarif
        run: |
          set -euo pipefail

          jq -e '.runs | type == "array" and length > 0' "$SCOUT_REPORT" >/dev/null
          findings="$(jq '[.runs[].results[]?] | length' "$SCOUT_REPORT")"
          rules="$(jq '[.runs[].tool.driver.rules[]?] | length' "$SCOUT_REPORT")"
          {
            echo "### Docker Scout (${{ matrix.platform }})"
            echo
            echo "- SARIF results: $findings"
            echo "- Vulnerability rules: $rules"
            echo "- Input: SPDX SBOM generated from the exact candidate digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: json
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          timeout: 15m
          exit-code: 0
          output: holycode-${{ matrix.suffix }}.trivy.json

      - name: Trivy fixable critical and high gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: holycode-protected-validation:${{ matrix.suffix }}
          format: json
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          timeout: 15m
          exit-code: 0
          ignore-unfixed: true
          output: holycode-${{ matrix.suffix }}.trivy-fixable.json

      - name: Validate Trivy fixable critical and high findings
        id: trivy_gate
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/validate_scanner_findings.py \
            --scanner trivy \
            --report "holycode-${{ matrix.suffix }}.trivy.json" \
            --release "$RELEASE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --accept-upstream-vulnerabilities \
            --accepted-findings "holycode-${{ matrix.suffix }}.trivy-accepted.json" \
            --as-of "$(date -u +%F)"

      - name: Collect architecture evidence
        if: always()
        env:
          CANDIDATE_DIGEST: ${{ needs.compose-candidate.outputs.digest }}
        run: |
          set -euo pipefail

          docker run --rm --entrypoint cat \
            "holycode-protected-validation:${{ matrix.suffix }}" \
            /usr/local/share/holycode/dpkg-inventory.txt \
            > "holycode-${{ matrix.suffix }}.dpkg-inventory.txt"
          docker image inspect \
            --format '{{.Id}}' \
            "holycode-protected-validation:${{ matrix.suffix }}" \
            > "holycode-${{ matrix.suffix }}.image-id.txt"
          printf '%s\n' "$CANDIDATE_DIGEST" > "holycode-${{ matrix.suffix }}.candidate-digest.txt"

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holycode-${{ inputs.release_version }}-${{ matrix.suffix }}-evidence
          if-no-files-found: error
          path: |
            holycode-${{ matrix.suffix }}.candidate-digest.txt
            holycode-${{ matrix.suffix }}.dpkg-inventory.txt
            holycode-${{ matrix.suffix }}.image-id.txt
            holycode-${{ matrix.suffix }}.scout-accepted.json
            holycode-${{ matrix.suffix }}.scout-fixable.sarif
            holycode-${{ matrix.suffix }}.scout.sarif
            holycode-${{ matrix.suffix }}.spdx.json
            holycode-${{ matrix.suffix }}.trivy-fixable.json
            holycode-${{ matrix.suffix }}.trivy-accepted.json
            holycode-${{ matrix.suffix }}.trivy.json
            holycode-${{ matrix.suffix }}.upgrade-rollback.txt

      - name: Enforce protected scanner gates
        if: always()
        env:
          SCOUT_GATE_OUTCOME: ${{ steps.scout_gate.outcome }}
          TRIVY_GATE_OUTCOME: ${{ steps.trivy_gate.outcome }}
        run: |
          set -eu
          test "$SCOUT_GATE_OUTCOME" = "success"
          test "$TRIVY_GATE_OUTCOME" = "success"

  release-validation:
    needs: [validate-source, build-candidate, compose-candidate, protected-validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce release validation
        env:
          SOURCE_RESULT: ${{ needs.validate-source.result }}
          BUILD_RESULT: ${{ needs.build-candidate.result }}
          COMPOSE_RESULT: ${{ needs.compose-candidate.result }}
          PROTECTED_RESULT: ${{ needs.protected-validation.result }}
        run: |
          set -eu
          test "$SOURCE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$PROTECTED_RESULT" = success

  promote-candidate:
    needs: release-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and commit title
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          current="$RELEASE_VERSION"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$current" | head -n 1 || true)"
          commit_title="$(git log -1 --format=%s "$GITHUB_SHA")"
          python scripts/validate_version.py \
            --version "$current" \
            --previous-version "$previous" \
            --tag-name "$current" \
            --commit-title "$commit_title"

      - name: Require matching source-bound draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_release_target.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --sha "$GITHUB_SHA" --require-draft \
            --previous-digest "${PREVIOUS_IMAGE##*@sha256:}"
      - name: Download protected candidate digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "holycode-$RELEASE_VERSION-candidate" \
            --dir candidate
          candidate_digest="$(tr -d '\r\n' < candidate/candidate-digest.txt)"
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CANDIDATE_DIGEST=$candidate_digest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck unpublished aliases before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_release_target.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --sha "$GITHUB_SHA" --require-draft \
            --previous-digest "${PREVIOUS_IMAGE##*@sha256:}"
      - name: Verify and promote exact protected candidate
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"
          source="$GHCR_IMAGE@$CANDIDATE_DIGEST"
          manifest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"$manifest")"
          platforms="$(jq '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' <<<"$manifest")"
          attestations="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<<"$manifest")"
          [ "$digest" = "$CANDIDATE_DIGEST" ]
          [ "$platforms" -eq 2 ]
          [ "$attestations" -ge 2 ]

          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$version" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            --tag "$GHCR_IMAGE:$version" \
            --tag "$GHCR_IMAGE:latest" \
            "$source"

      - name: Verify published manifests and attestations
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"
          refs=(
            "$DOCKERHUB_IMAGE:$version"
            "$DOCKERHUB_IMAGE:latest"
            "$GHCR_IMAGE:$version"
            "$GHCR_IMAGE:latest"
          )

          for attempt in $(seq 1 12); do
            ready=true
            for ref in "${refs[@]}"; do
              if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
                ready=false
                break
              fi
            done
            [ "$ready" = true ] && break
            sleep 10
          done
          [ "$ready" = true ]

          expected_digest=''
          for ref in "${refs[@]}"; do
            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')"
            digest="$(jq -er '.digest' <<<"$manifest")"
            platforms="$(jq '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' <<<"$manifest")"
            attestations="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<<"$manifest")"
            [ "$platforms" -eq 2 ]
            [ "$attestations" -ge 2 ]
            if [ -z "$expected_digest" ]; then
              expected_digest="$digest"
            else
              [ "$digest" = "$expected_digest" ]
            fi
            echo "$ref -> $digest ($platforms platforms, $attestations attestation manifests)"
          done

          [ "$expected_digest" = "$CANDIDATE_DIGEST" ]
          echo "Published multi-architecture digest: $expected_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach protected validation evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p release-evidence
          for artifact in \
            "holycode-$RELEASE_VERSION-amd64-evidence" \
            "holycode-$RELEASE_VERSION-arm64-evidence"; do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" \
              --dir "release-evidence/$artifact"
          done
          mapfile -d '' assets < <(find release-evidence -type f -print0)
          [ "${#assets[@]}" -gt 0 ]
          gh release upload "$RELEASE_VERSION" "${assets[@]}"

  update-dockerhub-description:
    needs: promote-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: coderluii/holycode
          short-description: "OpenCode in Docker, AI coding workstation with persistent state and curated tools"
          readme-filepath: ./docs/dockerhub-description.md
